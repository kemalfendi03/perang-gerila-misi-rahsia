name: Build Perang Gerila APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install requirements
        shell: bash
        run: |
          set -eux
          apt-get update
          apt-get install -y openjdk-17-jdk unzip wget

      - name: Install export templates
        shell: bash
        run: |
          set -eux
          mkdir -p /github/home/.local/share/godot/export_templates/4.4.1.stable
          cd /tmp
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q Godot_v4.4.1-stable_export_templates.tpz -d templates
          DEBUG=$(find templates -name android_debug.apk -print -quit)
          RELEASE=$(find templates -name android_release.apk -print -quit)
          test -n "$DEBUG"
          test -n "$RELEASE"
          cp "$DEBUG" /github/home/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk
          cp "$RELEASE" /github/home/.local/share/godot/export_templates/4.4.1.stable/android_release.apk

      - name: Create game
        shell: bash
        run: |
          set -eux
          mkdir -p game build

          cat > game/project.godot <<'EOF'
          config_version=5

          [application]
          config/name="Perang Gerila Malaysia"
          run/main_scene="res://main.tscn"

          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF

          cat > game/main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://main.gd" id="1"]

          [node name="Main" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > game/main.gd <<'EOF'
          extends Node3D

          var player
          var enemies = []
          var score = 0
          var hud
          var move_dir = Vector2.ZERO

          func _ready():
              make_world()
              make_player()
              make_enemies()
              make_ui()

          func make_world():
              var ground = MeshInstance3D.new()
              var plane = PlaneMesh.new()
              plane.size = Vector2(100, 100)
              ground.mesh = plane
              var mat = StandardMaterial3D.new()
              mat.albedo_color = Color(0.12, 0.25, 0.10)
              ground.material_override = mat
              add_child(ground)

              var light = DirectionalLight3D.new()
              light.rotation_degrees = Vector3(-55, -25, 0)
              add_child(light)

              for i in range(35):
                  var tree = MeshInstance3D.new()
                  tree.mesh = CylinderMesh.new()
                  tree.position = Vector3(randf_range(-35, 35), 1.5, randf_range(-35, 35))
                  var bark = StandardMaterial3D.new()
                  bark.albedo_color = Color(0.25, 0.14, 0.07)
                  tree.material_override = bark
                  add_child(tree)

          func make_player():
              player = CharacterBody3D.new()
              player.position = Vector3(0, 1, 0)
              add_child(player)

              var body = MeshInstance3D.new()
              body.mesh = CapsuleMesh.new()
              var mat = StandardMaterial3D.new()
              mat.albedo_color = Color(0.2, 0.35, 0.15)
              body.material_override = mat
              player.add_child(body)

              var camera = Camera3D.new()
              camera.position = Vector3(0, 4, 8)
              camera.rotation_degrees = Vector3(-20, 0, 0)
              player.add_child(camera)
              camera.current = true

          func make_enemies():
              for i in range(6):
                  var enemy = MeshInstance3D.new()
                  enemy.mesh = CapsuleMesh.new()
                  enemy.position = Vector3(randf_range(-15, 15), 1, randf_range(-15, 15))
                  var mat = StandardMaterial3D.new()
                  mat.albedo_color = Color(0.7, 0.1, 0.1)
                  enemy.material_override = mat
                  add_child(enemy)
                  enemies.append(enemy)

          func make_ui():
              var layer = CanvasLayer.new()
              add_child(layer)

              hud = Label.new()
              hud.position = Vector2(20, 20)
              hud.add_theme_font_size_override("font_size", 24)
              layer.add_child(hud)
              update_hud()

              add_button(layer, "MAJU", Vector2(30, 420), Vector2(0, -1))
              add_button(layer, "UNDUR", Vector2(30, 500), Vector2(0, 1))
              add_button(layer, "KIRI", Vector2(140, 500), Vector2(-1, 0))
              add_button(layer, "KANAN", Vector2(140, 420), Vector2(1, 0))

              var fire = Button.new()
              fire.text = "TEMBAK"
              fire.position = Vector2(950, 500)
              fire.size = Vector2(180, 80)
              layer.add_child(fire)
              fire.pressed.connect(shoot)

          func add_button(layer, title, pos, direction):
              var button = Button.new()
              button.text = title
              button.position = pos
              button.size = Vector2(100, 65)
              layer.add_child(button)
              button.button_down.connect(func(): move_dir = direction)
              button.button_up.connect(func(): move_dir = Vector2.ZERO)

          func _physics_process(delta):
              if player == null:
                  return

              player.position.x += move_dir.x * 5.0 * delta
              player.position.z += move_dir.y * 5.0 * delta

              for enemy in enemies:
                  if is_instance_valid(enemy):
                      var dir = player.position - enemy.position
                      dir.y = 0
                      if dir.length() > 1.5 and dir.length() < 15:
                          enemy.position += dir.normalized() * delta

          func shoot():
              var target = null
              var nearest = 15.0

              for enemy in enemies:
                  if is_instance_valid(enemy):
                      var distance = enemy.position.distance_to(player.position)
                      if distance < nearest:
                          nearest = distance
                          target = enemy

              if target != null:
                  enemies.erase(target)
                  target.queue_free()
                  score += 1
                  update_hud()

          func update_hud():
              if hud:
                  hud.text = "PERANG GERILA MALAYSIA\nMusuh ditumpaskan: " + str(score)
          EOF

          cat > game/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../build/PerangGerila.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          package/unique_name="com.kemalfendi03.perangerila"
          package/name="Perang Gerila Malaysia"
          package/signed=false
          EOF

      - name: Configure Android
        shell: bash
        run: |
          set -eux
          mkdir -p /github/home/.config/godot
          JAVA_PATH="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"

          cat > /github/home/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_PATH"
          EOF

      - name: Import project
        shell: bash
        run: godot --headless --editor --path game --quit

      - name: Export APK
        shell: bash
        run: godot --headless --path game --export-debug "Android" build/PerangGerila.apk

      - name: Check APK
        shell: bash
        run: test -s build/PerangGerila.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Perang-Gerila-APK
          path: build/PerangGerila.apk
