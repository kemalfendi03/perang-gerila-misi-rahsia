name: Build Perang Gerila APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create game
        shell: bash
        run: |
          mkdir -p game build

          cat > game/project.godot <<'EOF'
          config_version=5

          [application]
          config/name="Perang Gerila Malaysia"
          run/main_scene="res://main.tscn"

          [display]
          window/size/viewport_width=1280
          window/size/viewport_height=720
          window/handheld/orientation=1

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF

          cat > game/main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://main.gd" id="1"]

          [node name="Main" type="Node3D"]
          script = ExtResource("1")
          EOF

          cat > game/main.gd <<'EOF'
          extends Node3D

          var player: CharacterBody3D
          var enemies: Array[Node3D] = []
          var health := 100
          var score := 0
          var move_dir := Vector2.ZERO
          var hud: Label

          func _ready():
              make_world()
              make_player()
              make_enemies()
              make_hud()

          func make_world():
              var ground = MeshInstance3D.new()
              var mesh = PlaneMesh.new()
              mesh.size = Vector2(100, 100)
              ground.mesh = mesh
              var mat = StandardMaterial3D.new()
              mat.albedo_color = Color(0.12, 0.24, 0.10)
              ground.material_override = mat
              add_child(ground)

              var light = DirectionalLight3D.new()
              light.rotation_degrees = Vector3(-55, -25, 0)
              light.light_energy = 1.3
              add_child(light)

              var env = WorldEnvironment.new()
              var environment = Environment.new()
              environment.background_mode = Environment.BG_SKY
              environment.ambient_light_source = Environment.AMBIENT_SOURCE_COLOR
              environment.ambient_light_color = Color(0.5, 0.55, 0.5)
              env.environment = environment
              add_child(env)

              for i in range(35):
                  var tree = MeshInstance3D.new()
                  var trunk = CylinderMesh.new()
                  trunk.top_radius = 0.18
                  trunk.bottom_radius = 0.3
                  trunk.height = 2.8
                  tree.mesh = trunk
                  tree.position = Vector3(randf_range(-35,35), 1.4, randf_range(-35,35))
                  var tm = StandardMaterial3D.new()
                  tm.albedo_color = Color(0.25, 0.14, 0.07)
                  tree.material_override = tm
                  add_child(tree)

          func make_player():
              player = CharacterBody3D.new()
              player.position = Vector3(0, 1, 0)
              add_child(player)

              var body = MeshInstance3D.new()
              var capsule = CapsuleMesh.new()
              capsule.radius = 0.4
              capsule.height = 1.8
              body.mesh = capsule
              var uniform = StandardMaterial3D.new()
              uniform.albedo_color = Color(0.2, 0.32, 0.16)
              body.material_override = uniform
              player.add_child(body)

              var collision = CollisionShape3D.new()
              var shape = CapsuleShape3D.new()
              shape.radius = 0.4
              shape.height = 1.8
              collision.shape = shape
              player.add_child(collision)

              var camera = Camera3D.new()
              camera.position = Vector3(0, 3.5, 7)
              camera.rotation_degrees = Vector3(-18, 0, 0)
              player.add_child(camera)
              camera.current = true

          func make_enemies():
              for i in range(6):
                  var enemy = Node3D.new()
                  enemy.position = Vector3(randf_range(-15,15), 0.9, randf_range(-15,15))
                  add_child(enemy)

                  var mesh = MeshInstance3D.new()
                  var capsule = CapsuleMesh.new()
                  mesh.mesh = capsule
                  var mat = StandardMaterial3D.new()
                  mat.albedo_color = Color(0.65, 0.12, 0.1)
                  mesh.material_override = mat
                  enemy.add_child(mesh)
                  enemies.append(enemy)

          func make_hud():
              var layer = CanvasLayer.new()
              add_child(layer)

              hud = Label.new()
              hud.position = Vector2(20, 20)
              hud.add_theme_font_size_override("font_size", 26)
              layer.add_child(hud)
              update_hud()

              add_button(layer, "MAJU", Vector2(40, 470), Vector2(130, 65), "up")
              add_button(layer, "UNDUR", Vector2(40, 545), Vector2(130, 65), "down")
              add_button(layer, "KIRI", Vector2(180, 545), Vector2(110, 65), "left")
              add_button(layer, "KANAN", Vector2(180, 470), Vector2(110, 65), "right")
              add_button(layer, "TEMBAK", Vector2(980, 520), Vector2(180, 75), "fire")

          func add_button(layer, caption, pos, size, action):
              var button = Button.new()
              button.text = caption
              button.position = pos
              button.size = size
              button.add_theme_font_size_override("font_size", 22)
              layer.add_child(button)

              if action == "fire":
                  button.pressed.connect(shoot)
              else:
                  button.button_down.connect(func(): set_move(action, true))
                  button.button_up.connect(func(): set_move(action, false))

          func set_move(action, active):
              var amount = 1.0 if active else 0.0
              if action == "up":
                  move_dir.y = -amount
              elif action == "down":
                  move_dir.y = amount
              elif action == "left":
                  move_dir.x = -amount
              elif action == "right":
                  move_dir.x = amount

          func _physics_process(delta):
              if player == null:
                  return

              var direction = Vector3(move_dir.x, 0, move_dir.y).normalized()
              player.velocity.x = direction.x * 5.0
              player.velocity.z = direction.z * 5.0
              player.velocity.y -= 20.0 * delta
              player.move_and_slide()

              for enemy in enemies:
                  if is_instance_valid(enemy):
                      var distance = enemy.global_position.distance_to(player.global_position)
                      if distance < 12:
                          var toward = player.global_position - enemy.global_position
                          toward.y = 0
                          if toward.length() > 1.5:
                              enemy.global_position += toward.normalized() * delta * 1.2

          func shoot():
              var nearest = null
              var best_distance = 15.0

              for enemy in enemies:
                  if is_instance_valid(enemy):
                      var distance = enemy.global_position.distance_to(player.global_position)
                      if distance < best_distance:
                          best_distance = distance
                          nearest = enemy

              if nearest != null:
                  nearest.queue_free()
                  enemies.erase(nearest)
                  score += 1
                  update_hud()

          func update_hud():
              if hud:
                  hud.text = "PERANG GERILA MALAYSIA\nKesihatan: %d   Musuh ditumpaskan: %d" % [health, score]
          EOF

          cat > game/export_presets.cfg <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../build/PerangGerila.apk"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          package/unique_name="com.kemalfendi03.perangerila"
          package/name="Perang Gerila Malaysia"
          package/signed=true
          EOF

      - name: Import project
        shell: bash
        run: godot --headless --editor --path game --quit

      - name: Export Android APK
        shell: bash
        run: godot --headless --path game --export-debug "Android" build/PerangGerila.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Perang-Gerila-Android
          path: build/PerangGerila.apk
